<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Tình Yêu Lớn Hơn Vũ Trụ 💖 Món Quà 20/10 Dành Cho Bé Yêu</title>
  
  <!-- Chubby & Romantic Google Fonts with full Vietnamese subset -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Caveat:wght@500;600;700&family=Dancing+Script:wght@600;700&family=Fredoka:wght@600;700;800;900&family=Nunito:wght@700;800;900&display=swap&subset=vietnamese" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Three.js (3D WebGL Background Starfield & 3D Crystal Ruby Heart) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="mobile-optimized">

  <!-- Fullscreen 3D WebGL Canvas for Floating Glowing Hearts Starfield -->
  <canvas id="webglCanvas"></canvas>

  <!-- Ambient Cinematic Vignette -->
  <div class="cinematic-vignette"></div>

  <!-- Floating Music Button removed as requested -->

  <!-- =======================================================================
       MAIN INTERACTIVE STAGE (CHẠM BẤT KỲ ĐÂU TRÊN MÀN HÌNH ĐỂ CHUYỂN TIẾP)
       ======================================================================= -->
  
  <!-- Background Romantic Soundtrack (Video chuyển thành âm thanh) -->
  <audio id="romanticBgmAudio" src="assets/love_song.mp4" preload="auto" loop playsinline></audio>
  <video id="romanticBgmVideo" src="assets/love_song.mp4" preload="auto" loop playsinline style="display:none; width:0; height:0;"></video>

  <main id="interactiveStage" class="interactive-stage">

    <!-- CAMERA LENS ASSEMBLY (CHỨA 6 VẬT THỂ & TRÁI TIM 3D PHA LÊ) -->
    <div class="camera-lens-assembly" id="cameraLensAssembly">
      <!-- Knurled Barrel & Luxury Trim Rings -->
      <div class="lens-barrel-knurled" id="lensKnurledBarrel"></div>
      <div class="lens-luxury-red-ring"></div>
      <div class="lens-luxury-gold-stripe"></div>
      <div class="lens-bezel-rim"></div>

      <!-- Optical Glass Element -->
      <div class="lens-optical-glass" id="lensGlass">
        <div class="lens-photo-content" id="lensPhotoContent"></div>

        <!-- Optical Glare Reflections -->
        <div class="lens-glare-reflection glare-violet" id="glareViolet"></div>
        <div class="lens-glare-reflection glare-cyan" id="glareCyan"></div>
        <div class="lens-glare-reflection glare-streak" id="glareStreak"></div>
        <div class="lens-glass-concentric-ring"></div>
        <div class="lens-flash-burst" id="lensFlashBurst"></div>

        <!-- Mechanical Aperture Shutter Diaphragm -->
        <div class="lens-aperture-iris" id="lensApertureIris">
          <div class="iris-blade blade-1"></div>
          <div class="iris-blade blade-2"></div>
          <div class="iris-blade blade-3"></div>
          <div class="iris-blade blade-4"></div>
          <div class="iris-blade blade-5"></div>
          <div class="iris-blade blade-6"></div>
          <div class="iris-blade blade-7"></div>
          <div class="iris-blade blade-8"></div>
        </div>
      </div>
    </div>

    <!-- CLEAN INFO PANEL: CHỈ CÓ TÊN (NAME) VÀ KÍCH THƯỚC (SIZE) -->
    <div class="scale-info-panel" id="scaleInfoPanel">
      <h2 id="scaleTitle" class="scale-main-title">Con Kiến Nhỏ Bé</h2>
      <div id="scaleMeasure" class="scale-measure-badge">Kích thước: 1 milimét (0.001 m)</div>
    </div>

    <!-- ROMANTIC STORY TEXT DISPLAY (CHỮ TO, RÕ NÉT 100%, PHÁT SÁNG LỘNG LẪY & CHUYỂN CẢNH MƯỢT MÀ) -->
    <div class="romantic-story-display" id="romanticStoryDisplay">
      <div class="story-text-shimmer" id="storyTextShimmer">
        <div class="story-glow-aura"></div>
        <p id="storyMainText" class="story-main-text"></p>
        <div class="story-sparkle-accents">
          <span class="sparkle-star s1">✦</span>
          <span class="sparkle-star s2">✦</span>
          <span class="sparkle-star s3">✦</span>
        </div>
      </div>
    </div>

    <!-- FINALE CLIMAX CARD: 3 ẢNH POLAROID & BỨC THƯ TÌNH HỒNG HOÀNG GIA GỬI EMBE TRMYY -->
    <div class="finale-card-wrap" id="finaleCardWrap">
      
      <!-- 1. Bộ 3 Ảnh Kỷ Niệm Polaroid Đáng Yêu Của Embe Trmyy -->
      <div class="finale-photo-trio">
        <div class="trio-item item-1">
          <div class="trio-washi-tape"></div>
          <div class="trio-frame">
            <img src="assets/photo1.jpg" alt="Bé Yêu Của Anh" class="trio-img" />
          </div>
          <span class="trio-caption">Bé Yêu Của Anh 💕</span>
        </div>
        <div class="trio-item item-2">
          <div class="trio-washi-tape tape-gold"></div>
          <div class="trio-frame">
            <img src="assets/photo2.jpg" alt="Embe Trmyy Đáng Yêu" class="trio-img" />
          </div>
          <span class="trio-caption">Embe Trmyy Đáng Yêu 🌸</span>
        </div>
        <div class="trio-item item-3">
          <div class="trio-washi-tape"></div>
          <div class="trio-frame">
            <img src="assets/photo3.jpg" alt="Nụ Cười Tỏa Nắng" class="trio-img" />
          </div>
          <span class="trio-caption">Nụ Cười Tỏa Nắng ✨</span>
        </div>
      </div>

      <!-- 2. BỨC THƯ TÌNH HỒNG HOÀNG GIA ĐÀNG HOÀNG VỚI VIỀN HOA VĂN & BÚT MÁY MẠ VÀNG -->
      <div class="romantic-letter-card" id="romanticLetterCard">
        
        <!-- 4 Góc Hoa Văn Hoàng Gia Mạ Vàng Quý Tộc (Victorian Gold Baroque Corners) -->
        <svg class="corner-filigree corner-tl" viewBox="0 0 40 40" fill="none">
          <path d="M4 36V12C4 7.58 7.58 4 12 4H36M4 16C8 16 16 12 16 4M8 26C8 16 16 8 26 8M4 4L14 14" stroke="url(#cornerGoldGrad)" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="14" cy="14" r="2" fill="url(#cornerGoldGrad)"/>
        </svg>
        <svg class="corner-filigree corner-tr" viewBox="0 0 40 40" fill="none">
          <path d="M36 36V12C36 7.58 32.42 4 28 4H4M36 16C32 16 24 12 24 4M32 26C32 16 24 8 14 8M36 4L26 14" stroke="url(#cornerGoldGrad)" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="26" cy="14" r="2" fill="url(#cornerGoldGrad)"/>
        </svg>
        <svg class="corner-filigree corner-bl" viewBox="0 0 40 40" fill="none">
          <path d="M4 4V28C4 32.42 7.58 36 12 36H36M4 24C8 24 16 28 16 36M8 14C8 24 16 32 26 32M4 36L14 26" stroke="url(#cornerGoldGrad)" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="14" cy="26" r="2" fill="url(#cornerGoldGrad)"/>
        </svg>
        <svg class="corner-filigree corner-br" viewBox="0 0 40 40" fill="none">
          <path d="M36 4V28C36 32.42 32.42 36 28 36H4M36 24C32 24 24 28 24 36M32 14C32 24 24 32 14 32M36 36L26 26" stroke="url(#cornerGoldGrad)" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="26" cy="26" r="2" fill="url(#cornerGoldGrad)"/>
        </svg>

        <!-- SVG Gradients Definition -->
        <svg width="0" height="0" style="position: absolute;">
          <defs>
            <linearGradient id="cornerGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#fffbeb"/>
              <stop offset="30%" stop-color="#fde047"/>
              <stop offset="70%" stop-color="#f59e0b"/>
              <stop offset="100%" stop-color="#b45309"/>
            </linearGradient>
            <linearGradient id="penGoldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#92400e"/>
              <stop offset="35%" stop-color="#f59e0b"/>
              <stop offset="65%" stop-color="#fde047"/>
              <stop offset="100%" stop-color="#fffbeb"/>
            </linearGradient>
            <linearGradient id="penPlumeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#be123c"/>
              <stop offset="40%" stop-color="#fb7185"/>
              <stop offset="80%" stop-color="#ffd1dc"/>
              <stop offset="100%" stop-color="#ffffff"/>
            </linearGradient>
          </defs>
        </svg>

        <!-- Con Dấu Sáp 3D Hoàng Gia (Royal 3D Wax Seal with Draped Ribbons) -->
        <div class="royal-wax-seal-container">
          <div class="wax-ribbon ribbon-left"></div>
          <div class="wax-ribbon ribbon-right"></div>
          <div class="royal-wax-seal">
            <div class="wax-seal-inner">
              <span class="wax-heart-symbol">❦</span>
              <span class="wax-seal-text">20/10</span>
            </div>
          </div>
        </div>

        <!-- Tem Bưu Chính Cổ Điển Tình Yêu (Vintage Love Stamp in Top Right) -->
        <div class="vintage-love-stamp">
          <div class="stamp-inner">
            <span class="stamp-icon">💌</span>
            <span class="stamp-text">LOVE POST</span>
            <span class="stamp-value">20.10</span>
          </div>
          <div class="stamp-postmark">
            <span class="postmark-line"></span>
            <span class="postmark-line"></span>
            <span class="postmark-line"></span>
          </div>
        </div>

        <!-- Tiêu Đề Thư Nắn Nót Lãng Mạn -->
        <div class="letter-header-area">
          <span class="letter-badge-tag">Thư Tình Trao Gửi 💌</span>
          <h3 class="letter-salutation">
            Gửi Embe Trmyy dễ thương của anh 💕
          </h3>
          <div class="letter-ornament-divider">
            <span class="divider-scroll left"></span>
            <span class="divider-gem">💖</span>
            <span class="divider-scroll right"></span>
          </div>
        </div>

        <!-- Nội Dung Thư Có Dòng Kẻ & Bút Máy Thật Viết Từng Chữ -->
        <div class="letter-body-content" id="letterBodyContent"><span id="letterTypewriterText" class="letter-typewriter-text"></span><span id="calligraphyPenHolder" class="calligraphy-pen-holder"><span class="pen-nib-sparkle">✦</span><span class="pen-ink-spot"></span><svg class="royal-calligraphy-pen" viewBox="0 0 64 64" fill="none"><ellipse cx="14" cy="54" rx="10" ry="3" fill="rgba(0,0,0,0.22)" filter="blur(2px)"/><path d="M6 56L18 44L26 48L14 60L6 56Z" fill="url(#penGoldGrad)" stroke="#b45309" stroke-width="0.8"/><circle cx="16" cy="50" r="1.2" fill="#78350f"/><line x1="6" y1="56" x2="16" y2="50" stroke="#78350f" stroke-width="0.9"/><path d="M12 55C15 52 18 51 21 47" stroke="#fff" stroke-width="0.6" opacity="0.8"/><path d="M10 57C13 54 15 54 17 52" stroke="#b45309" stroke-width="0.6" opacity="0.6"/><path d="M18 44L26 48L32 42L24 38L18 44Z" fill="#881337" stroke="#f59e0b" stroke-width="0.8"/><line x1="21" y1="41" x2="29" y2="45" stroke="#fde047" stroke-width="1.2"/><path d="M28 38C34 26 42 16 58 4C62 2 64 6 60 14C56 22 48 30 38 38C34 42 30 42 28 38Z" fill="url(#penPlumeGrad)" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.3))"/><path d="M58 4C48 16 38 28 28 38" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/><path d="M52 10C48 16 43 20 40 24" stroke="#ffffff" stroke-width="0.8" opacity="0.6"/><path d="M46 16C42 22 38 25 35 29" stroke="#ffffff" stroke-width="0.8" opacity="0.6"/><rect x="23" y="37" width="10" height="3" rx="1.5" transform="rotate(-40 23 37)" fill="url(#penGoldGrad)" stroke="#92400e" stroke-width="0.5"/><circle cx="28" cy="38" r="1.5" fill="#e11d48"/></svg></span></div>

        <!-- Chữ Ký Nắn Nót & Nụ Hôn Yêu Thương Dành Riêng Cho Embe Trmyy -->
        <div class="letter-signature-wrap" id="letterSignatureWrap">
          <p class="letter-signature">Mãi yêu Embe Trmyy 3000! 💖</p>
          <div class="signature-details">
            <span class="signature-date">20 Tháng 10 • Yêu Em Vô Tận ✨</span>
            <span class="signature-kiss-stamp">💋</span>
          </div>
        </div>

        <!-- Nút Xem Lại Từ Đầu -->
        <button id="replayBtn" class="btn-replay-journey">
          <i data-lucide="rotate-ccw"></i>
          <span>Xem Lại Từ Đầu</span>
        </button>
      </div>
    </div>

    <!-- SUBTLE SCREEN TAP HINT -->
    <div class="tap-screen-hint" id="tapScreenHint">
      <span class="hint-pulse-dot"></span>
      <span class="hint-text">Chạm màn hình để tiếp tục ✨</span>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
